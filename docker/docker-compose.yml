services:
  # Policy Engine — OPA-based access control
  # Evaluates every MCP tool call against role-based policies
  #
  # OPA automatically loads all .rego and .json files from /policies on startup.
  # No sidecar loader needed — policies/docs-domain.rego and policies/roles-data.json
  # are mounted directly.
  mpe:
    image: openpolicyagent/opa:latest
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - ../policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "/policies"
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # The MCP filesystem server runs as a Node.js process inside the
  # Express backend (not as a separate container), since the official
  # MCP filesystem server uses stdio transport. The docs-corpus is
  # mounted into the backend's working directory.

  # Elasticsearch — durable, searchable storage for prompt history and
  # audit trail records (see .sudocode/issues/ISSUE-030). Single-node,
  # security disabled for local dev only (ES 8.x enables TLS+auth by
  # default even for one node).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  es-data:
